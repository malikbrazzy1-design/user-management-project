<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>User Management Portal</title><link rel="stylesheet" href="style.css"></head><body><main><header><h1>User Management Portal</h1><p>Register, sign in, and explore the user database</p></header><section class="grid"><article><h2>Create Account</h2><form id="register"><input name="username" placeholder="Username" required><input name="password" type="password" placeholder="Password (8+ characters)" minlength="8" required><input name="firstname" placeholder="First name" required><input name="lastname" placeholder="Last name" required><input name="salary" type="number" step="0.01" min="0" placeholder="Salary" required><input name="age" type="number" min="0" placeholder="Age" required><button>Register</button></form></article><article><h2>Sign In</h2><form id="login"><input name="username" placeholder="Username" required><input name="password" type="password" placeholder="Password" required><button>Sign In</button></form><p id="welcome"></p></article></section><article><h2>Search Users</h2><div class="searchgrid"><label>Search type<select id="type"><option value="name">First and/or last name</option><option value="userid">User ID</option><option value="salary">Salary range</option><option value="age">Age range</option><option value="after">Registered after user</option><option value="never">Never signed in</option><option value="same">Same registration day</option><option value="today">Registered today</option></select></label><div id="fields"></div><button id="search">Search</button></div><p id="status" role="status"></p><div class="tablewrap"><table><thead><tr><th>User ID</th><th>First name</th><th>Last name</th><th>Salary</th><th>Age</th><th>Registered</th><th>Last sign-in</th></tr></thead><tbody id="results"></tbody></table></div></article></main><script src="script.js"></script></body></html>
